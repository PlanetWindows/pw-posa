  <section id="loginView" class="login-shell"><div class="brand-panel"><div class="brand-logo-card"><img src="logo_planet.svg" alt="Planet Windows" class="brand-logo-full" /></div><div class="brand-copy"><div class="eyebrow">PLANET WINDOWS</div><h1>PW Posa</h1><p>Gestione pose, squadre e attività in cantiere.</p></div></div><form id="loginForm" class="login-card"><h2>Accedi</h2><p class="muted">Usa l’account Ufficio o Posatori.</p><label>Email<input id="email" type="email" autocomplete="username" required placeholder="nome@azienda.it" /></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" /></label><button class="btn primary" type="submit">Accedi</button><div id="loginError" class="form-error"></div></form></section>
