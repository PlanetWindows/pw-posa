<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c99b43" />
  <title>PW Posa</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260901-reports1" />
  <link rel="stylesheet" href="enhancements.css?v=20260902-1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <section id="loginView" class="login-shell"><div class="brand-panel"><div class="brand-logo-card"><img src="logo_planet.svg" alt="Planet Windows" class="brand-logo-full" /></div><div class="brand-copy"><div class="eyebrow">PLANET WINDOWS</div><h1>PW Posa</h1><p>Gestione pose, squadre e attività in cantiere.</p></div></div><form id="loginForm" class="login-card"><h2>Accedi</h2><p class="muted">Usa l’account Ufficio o Posatori.</p><label>Email<input id="email" type="email" autocomplete="username" required placeholder="nome@azienda.it" /></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" /></label><button class="btn primary" type="submit">Accedi</button><div id="loginError" class="form-error"></div></form></section>
  <section id="appView" class="app-shell hidden"><aside class="sidebar"><div class="sidebar-brand"><div class="sidebar-logo-card"><img src="logo_planet.svg" alt="Planet Windows" class="sidebar-logo" /></div><div><strong>PW Posa</strong><span id="roleLabel">—</span></div></div><nav id="officeNav" class="nav hidden"><button data-view="calendar" class="nav-item active">Calendario</button><button data-view="poses" class="nav-item">Pose</button><button data-view="teams" class="nav-item">Squadre</button><button data-view="issues" class="nav-item">Segnalazioni</button><button data-view="documents" class="nav-item">Documenti</button></nav><nav id="installerNav" class="nav hidden"><button data-view="calendar" class="nav-item active">Calendario</button><button data-view="myposes" class="nav-item">Le mie pose</button><button data-view="issues" class="nav-item">Segnalazioni</button><button data-view="documents" class="nav-item">Documenti</button></nav><div class="sidebar-footer"><div id="userEmail" class="user-email"></div><button id="logoutBtn" class="btn ghost">Esci</button></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">PW POSA</div><h2 id="pageTitle">Calendario</h2></div><div class="topbar-actions"><button id="newPoseBtn" class="btn primary hidden">+ Nuova posa</button><button id="topLogoutBtn" class="btn ghost top-logout">Esci</button></div></header><div id="content" class="content"></div></main></section>
  <dialog id="poseDialog" class="dialog pose-modal">
    <form id="poseForm" method="dialog" class="modal-layout">
      <div class="dialog-head modal-header"><div class="dialog-title-wrap"><div class="eyebrow">PROGRAMMAZIONE</div><h3 id="poseDialogTitle">Nuova posa</h3></div><button type="button" class="icon-btn" id="closePoseDialog" aria-label="Chiudi">×</button></div>
      <input type="hidden" id="poseId" />
      <div class="modal-scroll" id="poseModalScroll">
        <div class="grid2">
          <label>Commessa *<input id="jobNumber" required /></label>
          <label>Cliente *<input id="clientName" required /></label>
          <label>Telefono<input id="clientPhone" /></label>
          <label>Squadra *<select id="teamId" required></select></label>
          <label>Finanziamento<select id="financing" required><option value="false">No</option><option value="true">Sì</option></select></label>
          <label class="span2">Indirizzo *<input id="address" required /></label>
          <label>Città<input id="city" /></label>
          <label>CAP<input id="postalCode" /></label>
          <label>Data inizio posa *<input id="scheduledDate" type="date" required /></label>
          <label>Data fine posa prevista *<input id="scheduledEndDate" type="date" required /></label>
          <label>Ora inizio *<input id="startTime" type="time" required /></label>
          <label>Ora fine<input id="endTime" type="time" /></label>
          <label class="span2">Note ufficio<textarea id="officeNotes" rows="3"></textarea></label>
        </div>
      </div>
      <div class="dialog-actions modal-footer"><button type="button" class="btn ghost" id="cancelPoseBtn">Annulla</button><button type="submit" class="btn primary">Salva posa</button></div>
    </form>
  </dialog>
  <dialog id="detailDialog" class="dialog wide"><div class="dialog-head"><div class="dialog-title-wrap"><div class="eyebrow">DETTAGLIO POSA</div><h3 id="detailTitle">—</h3></div><div class="detail-head-actions"><button type="button" class="btn ghost edit-pose-btn hidden" id="editPoseBtn" title="Modifica posa">✎ Modifica</button><button type="button" class="icon-btn" id="closeDetailDialog" aria-label="Chiudi">×</button></div></div><div id="detailContent"></div></dialog>
  <script src="config.js?v=20260901-loginfix2"></script>
  <script src="app.js?v=20260901-checklist1"></script>
  <script src="reports.js?v=20260901-reports1"></script>
  <script src="range.js?v=20260902-1"></script>
  <script src="photos.js?v=20260902-1"></script>
  <script src="report-storage.js?v=20260902-1"></script>
</body>
</html>
